packages:
  - apps/*
  - packages/*
  - tooling/*

# Exact pins, supply-chain buffer, strict engines.
saveExact: true
minimumReleaseAge: 10080
engineStrict: true

# Packages allowed to run install scripts. pnpm 11+ reads allowBuilds;
# pnpm 10 (some Macs) reads onlyBuiltDependencies. Keep both in sync.
allowBuilds:
  sharp: true
  esbuild: true
  '@tailwindcss/oxide': true
onlyBuiltDependencies:
  - sharp
  - esbuild
  - '@tailwindcss/oxide'

# Every third-party version lives here once. Packages depend on "catalog:".
# Changes only by the orchestrator between waves (see docs/CONVENTIONS.md).
catalog:
  # framework
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0
  babel-plugin-react-compiler: 1.0.0
  server-only: 0.0.1
  # styling and ui primitives
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  tw-animate-css: 1.4.0
  radix-ui: 1.8.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  lucide-react: 1.55.0
  sonner: 2.0.8
  vaul: 1.1.2
  # data, validation, jobs, auth
  zod: 4.6.5
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  pg: 8.23.1
  pg-boss: 12.37.0
  better-auth: 1.7.7
  sanitize-html: 2.18.0
  # media, documents, 3d, integrations
  sharp: 0.35.5
  three: 0.186.1
  '@react-pdf/renderer': 4.9.0
  '@anthropic-ai/sdk': 0.131.0
  # Official SheetJS tarball: the npm registry stops at 0.18.5, which has two high advisories
  # (prototype pollution, ReDoS). 0.20.3 fixes both; same API.
  xlsx: https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
  # tooling
  typescript: 5.9.3
  turbo: 2.11.7
  tsx: 4.23.15
  vitest: 5.0.3
  vite: 8.3.4
  happy-dom: 21.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  '@playwright/test': 1.63.0
  '@next/playwright': 16.4.0
  '@axe-core/playwright': 4.13.0
  '@lhci/cli': 0.15.1
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  typescript-eslint: 8.71.1
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  '@next/eslint-plugin-next': 16.4.0
  globals: 17.13.0
  # types
  '@types/node': 22.20.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/pg': 8.23.1
  '@types/three': 0.186.0
  '@types/sanitize-html': 2.16.2
